$('#show').onclick=()=>openRow(bills[0]?.id||null);$('#hide').onclick=()=>openRow(null);function lum(c){let a=c.match(/\w\w/g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return a[0]*.2126+a[1]*.7152+a[2]*.0722}function contrast(a,b){let x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}function mix(a,b,w){return '#'+[0,2,4].map(i=>Math.round(parseInt(a.slice(i+1,i+3),16)*(1-w)+parseInt(b.slice(i+1,i+3),16)*w).toString(16).padStart(2,'0')).join('')}function ink(bg){let d=contrast(bg,'#202124'),l=contrast(bg,'#FFFFFF');return Math.max(d,l)<4.5?'#000000':d>=l?'#202124':'#FFFFFF'}function theme(){let p=color,s=dark?'#1C2026':'#FFFFFF';for(let i=1;i<=100&&contrast(p,s)<4.5;i++)p=mix(color,dark?'#FFFFFF':'#000000',i/100);let bg=dark?mix(color,'#20242B',.65):color;$('#phone').classList.toggle('dark',dark);$('#phone').style.setProperty('--accent',bg);$('#phone').style.setProperty('--onaccent',ink(bg));$('#phone').style.setProperty('--primary',p);$('#phone').style.setProperty('--soft',dark?mix(color,'#20242B',.88):mix(color,'#FFFFFF',.88));document.querySelectorAll('[data-color]').forEach(e=>e.classList.toggle('active',e.dataset.color===color));$('#dark').textContent=dark?'浅色模式':'深色模式'}$('#swatches').innerHTML=colors.map(c=>'<button data-color="'+c+'" style="background:'+c+'" aria-label="主题 '+c+'"></button>').join('');document.querySelectorAll('[data-color]').forEach(e=>e.onclick=()=>{color=e.dataset.color;theme()});$('#dark').onclick=()=>{dark=!dark;theme()};render();theme();const q=new URLSearchParams(location.search);if(q.get('open')==='1')openRow('e1');if(q.get('dark')==='1'){dark=true;color='#B39BE5';theme()}
